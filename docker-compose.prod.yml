# Production compose for the Nexora API stack.
#
# Required variables (no defaults — compose refuses to start without them):
#   POSTGRES_PASSWORD, JWT_SECRET_KEY
# Supply them via the shell environment or an env file; never commit real secrets:
#   docker compose --env-file /path/to/prod.env -f docker-compose.prod.yml up -d --build
# See .env.example for the full variable contract and example (fake) values.

services:
  postgres:
    image: postgres:17
    container_name: nexora-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment or .env}
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexora} -d ${POSTGRES_DB:-nexora}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: nexora-qdrant-prod
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexora-api:latest
    container_name: nexora-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nexora}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexora}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in the environment or .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_PATH: /app/storage
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-10485760}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-nexora_document_chunks}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-2}
      RETRIEVAL_DENSE_TOP_K: ${RETRIEVAL_DENSE_TOP_K:-10}
      RETRIEVAL_LEXICAL_TOP_K: ${RETRIEVAL_LEXICAL_TOP_K:-10}
      RETRIEVAL_RERANK_TOP_K: ${RETRIEVAL_RERANK_TOP_K:-8}
      RETRIEVAL_MIN_RELEVANCE: ${RETRIEVAL_MIN_RELEVANCE:-0.5}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-300}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-256}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - api_storage:/app/storage

volumes:
  postgres_storage:
  qdrant_storage:
  api_storage:
