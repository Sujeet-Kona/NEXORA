name: CI

concurrency:
  group: nexora-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [main, nexora/final-hardening]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora
          POSTGRES_DB: nexora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://nexora:nexora@localhost:5432/nexora_test
      TEST_DATABASE_URL: postgresql+psycopg://nexora:nexora@localhost:5432/nexora_test
      JWT_SECRET_KEY: ci-only-insecure-secret-do-not-use-in-production
      JWT_ALGORITHM: HS256
      STORAGE_BACKEND: local
      STORAGE_PATH: storage

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate production Compose configuration
        env:
          POSTGRES_PASSWORD: compose-validation-only-password
          JWT_SECRET_KEY: compose-validation-only-0123456789abcdefghijklmnopqrstuvwxyz
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Inspect LoRA PDF extraction and ground-truth anchors
        run: python scripts/inspect_lora_pdf.py

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Dependency security audit
        run: pip-audit -r requirements.txt

      - name: Byte-compile backend
        run: python -m compileall -q backend

      - name: Run tests
        run: pytest -q --junitxml=test-results.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Create isolated smoke-test environment
        run: |
          umask 077
          cat > .env.verify <<'EOF'
          POSTGRES_USER=nexora
          POSTGRES_PASSWORD=compose-smoke-only-password
          POSTGRES_DB=nexora
          JWT_SECRET_KEY=compose-smoke-only-0123456789abcdefghijklmnopqrstuvwxyz
          LLM_PROVIDER=openai
          OPENAI_API_KEY=compose-smoke-only-key
          OPENAI_MODEL=compose-smoke-only-model
          API_PORT=18000
          EOF

      - name: Build and start production Compose stack
        run: |
          docker compose -p nexora_ci --env-file .env.verify \
            -f docker-compose.prod.yml up -d --build

      - name: Verify API readiness after migrations
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18000/health/ready; then
              echo
              exit 0
            fi
            sleep 5
          done
          docker compose -p nexora_ci --env-file .env.verify \
            -f docker-compose.prod.yml ps
          docker compose -p nexora_ci --env-file .env.verify \
            -f docker-compose.prod.yml logs --no-color
          exit 1

      - name: Verify registration, login, profile, refresh, and logout
        run: |
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen

          base = "http://127.0.0.1:18000/api/v1/auth"

          def call(path, payload=None, token=None):
              data = None if payload is None else json.dumps(payload).encode()
              headers = {"Content-Type": "application/json"}
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              request = Request(f"{base}/{path}", data=data, headers=headers)
              with urlopen(request, timeout=15) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          call("register", {
              "email": "nexora-ci-smoke@example.com",
              "full_name": "NEXORA CI Smoke",
              "password": "ci-smoke-only-password-2026",
          })
          tokens = call("login", {
              "email": "nexora-ci-smoke@example.com",
              "password": "ci-smoke-only-password-2026",
          })
          profile = call("me", token=tokens["access_token"])
          assert profile["email"] == "nexora-ci-smoke@example.com"
          rotated = call("refresh", {"refresh_token": tokens["refresh_token"]})
          call("logout", {"refresh_token": rotated["refresh_token"]})
          print("registration/login/profile/refresh/logout: PASS")
          PY

      - name: Tear down isolated stack
        if: always()
        run: |
          docker compose -p nexora_ci --env-file .env.verify \
            -f docker-compose.prod.yml down -v --remove-orphans
