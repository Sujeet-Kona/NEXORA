name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora
          POSTGRES_DB: nexora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://nexora:nexora@localhost:5432/nexora_test
      TEST_DATABASE_URL: postgresql+psycopg://nexora:nexora@localhost:5432/nexora_test
      JWT_SECRET_KEY: ci-only-insecure-secret-do-not-use-in-production
      JWT_ALGORITHM: HS256
      STORAGE_BACKEND: local
      STORAGE_PATH: storage

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Validate evaluation dataset
        run: python -c "from backend.evaluation.dataset import validate_dataset; validate_dataset()"

      - name: Byte-compile backend
        run: python -m compileall -q backend

      - name: Run tests
        run: pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate production Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-password
          JWT_SECRET_KEY: ci-only-jwt-secret-key-that-is-long-enough-for-config-validation
        run: docker compose -f docker-compose.prod.yml config -q

      - name: Build production image
        run: docker build --tag nexora:ci .
